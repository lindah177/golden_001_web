{% extends "base.html" %}

{% block title %}Contact — Golden Ark Care Centre{% endblock %}

{% block content %}
<section class="py-5" style="background:#FFF8EE;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <p class="text-uppercase fw-bold small mb-1" style="color:#2D7DD2; letter-spacing:0.1em;">Get In Touch</p>
        <h2 class="fw-bold mb-2">Partner With Us</h2>
        <p class="text-secondary mb-4">Volunteer, partner, or simply say hello. We'd love to hear from you.</p>

        <div class="card border-0 shadow-sm rounded-4 p-4">
          <form method="POST" action="{{ url_for('public.contact') }}">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Your Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Thandi Mokoena" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">How can you help?</label>
              <select name="enquiry_type" class="form-select">
                <option>I want to volunteer</option>
                <option>I want to donate goods</option>
                <option>I represent a company / sponsor</option>
                <option>I have a general enquiry</option>
              </select>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold small">Message</label>
              <textarea name="message" class="form-control" rows="4" placeholder="Tell us more…" required></textarea>
            </div>
            <button type="submit" class="btn text-white fw-bold px-4" style="background:#2D7DD2;">
              Send Message →
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>
</section>
{% endblock %}
